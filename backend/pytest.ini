[pytest]
# rootdir is backend/ (this file is the inifile); paths below resolve against it.

# Puts backend/ on sys.path so `from app.main import create_app` resolves no
# matter how pytest is invoked. Without this, prepend import mode only adds
# backend/test (test/ has no __init__.py) and bare `pytest` does not add cwd.
pythonpath = .

# Collection never leaves backend/test, so scripts/ and anything else at the
# backend root can never be picked up.
testpaths = test

# testpaths only applies when no path args are given, so keep an explicit
# blocklist for `pytest .`-style invocations. Setting this key REPLACES
# pytest's defaults, so venv/node_modules/etc. are re-listed here.
norecursedirs = venv .venv env ENV .git .pytest_cache __pycache__ node_modules build dist *.egg scripts

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra --strict-markers --strict-config
